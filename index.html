
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智慧儀表板 Pro (極致通透版)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Roboto:wght@100;300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --board-bg: #11151b;
            --board-bg-strong: #07090c;
            --board-border: rgba(255, 193, 77, 0.45);
            --board-shadow: 0 18px 50px rgba(0, 0, 0, 0.62);
            --station-yellow: #ffc14d;
            --station-amber: #ff9f1c;
            --station-white: #f8f3e8;
            --station-muted: #a8aaad;
            --station-green: #43d17a;
            --station-red: #ff5d5d;
            --glass-bg: var(--board-bg);
            --glass-border: var(--board-border);
            --glass-shadow: var(--board-shadow);
            --theme-blue: var(--station-yellow);
            --accent-pink: var(--station-amber);
            --accent-gold: var(--station-yellow);
            --accent-mint: var(--station-green);
            --text-main: var(--station-white);
            --text-muted: var(--station-muted);
            --shift-x: 0px;
            --shift-y: 0px;
            --hour-progress: 0%;
        }

        body.night-mode {
            --glass-bg: rgba(9, 8, 13, 0.62);
            --glass-border: rgba(255, 209, 102, 0.12);
            --theme-blue: #ffbd80;
            --accent-pink: #ff7aa9;
            --accent-gold: #ffd166;
            --accent-mint: #9cf5d7;
            --text-main: #fff5e8;
            --text-muted: #c5b9a4;
        }

        body {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background:
                radial-gradient(circle at 50% 0%, rgba(255,193,77,0.16), transparent 34%),
                linear-gradient(180deg, rgba(255,193,77,0.08), transparent 22%),
                linear-gradient(135deg, #101216 0%, #17140f 48%, #060708 100%);
            background-size: cover; background-position: center;
            color: var(--text-main); font-family: 'Noto Sans TC', sans-serif;
            overflow: hidden; box-sizing: border-box; padding: 3vh 3vw;
            transition: background 2s ease, color 2s ease;
            position: relative;
        }

        body::before {
            content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background:
                linear-gradient(90deg, transparent 0 8%, rgba(255,193,77,0.08) 8% 8.4%, transparent 8.4% 100%),
                repeating-linear-gradient(0deg, rgba(255,193,77,0.025) 0 1px, transparent 1px 32px);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0.78), rgba(0,0,0,0.12));
        }

        body::after {
            content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 4px);
            mix-blend-mode: screen; opacity: 0.24;
        }

        #weather-ambience {
            position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
            opacity: 0; transition: opacity 1.8s ease, filter 1.8s ease;
        }
        body.page-hidden #weather-ambience *,
        body.page-hidden #hourly-overlay * {
            animation-play-state: paused !important;
        }
        body.weather-rain #weather-ambience,
        body.weather-cloudy #weather-ambience,
        body.weather-sunny #weather-ambience,
        body.weather-comfort #weather-ambience {
            opacity: 1;
        }
        .weather-layer {
            position: absolute; inset: 0; opacity: 0; transition: opacity 1.8s ease;
        }
        .weather-rain-layer {
            inset: -22vh -8vw;
            background:
                linear-gradient(180deg, rgba(32,40,48,0.48), rgba(4,5,7,0.18));
        }
        #rain-canvas {
            position: absolute; inset: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 1.2s ease;
        }
        body.weather-rain {
            background:
                linear-gradient(180deg, rgba(70,78,86,0.24), rgba(0,0,0,0.2)),
                linear-gradient(135deg, #101418 0%, #07090b 58%, #020303 100%);
        }
        body.weather-rain .weather-rain-layer { opacity: 0.64; }
        body.weather-rain #rain-canvas { opacity: calc(0.42 + var(--rain-strength, 0.5) * 0.3); }

        .weather-cloud-layer {
            background:
                linear-gradient(180deg, rgba(120,120,116,0.22), rgba(20,21,22,0.28)),
                repeating-linear-gradient(0deg, rgba(160,160,150,0.08) 0 1px, transparent 1px 54px);
            filter: saturate(0.55);
        }
        .weather-cloud-layer::before,
        .weather-cloud-layer::after {
            content: ""; position: absolute; left: -18%; right: -18%; height: 34vh;
            background:
                linear-gradient(90deg, transparent, rgba(190,190,178,0.14), transparent),
                repeating-linear-gradient(90deg, transparent 0 120px, rgba(210,210,198,0.1) 120px 220px, transparent 220px 340px);
            filter: blur(18px);
            transform: skewX(-8deg);
            animation: cloudDrift 18s ease-in-out infinite alternate;
        }
        .weather-cloud-layer::before { top: 7vh; }
        .weather-cloud-layer::after { top: 34vh; opacity: 0.72; animation-duration: 24s; animation-direction: alternate-reverse; }
        body.weather-cloudy {
            background:
                linear-gradient(180deg, rgba(105,105,100,0.2), rgba(0,0,0,0.24)),
                linear-gradient(135deg, #111313 0%, #080909 54%, #030303 100%);
        }
        body.weather-cloudy .weather-cloud-layer { opacity: 0.78; }

        .weather-sun-layer {
            background:
                linear-gradient(115deg, transparent 0 28%, rgba(244,231,182,0.12) 48%, transparent 68%),
                linear-gradient(180deg, rgba(244,231,182,0.13), transparent 38%);
        }
        .sun-disc {
            position: absolute; top: 6vh; right: 7vw; width: min(18vw, 260px); aspect-ratio: 1;
            border-radius: 50%; border: 2px solid rgba(244,231,182,0.42);
            background: radial-gradient(circle, rgba(244,231,182,0.6) 0 10%, rgba(244,231,182,0.18) 42%, transparent 70%);
            box-shadow: 0 0 70px rgba(244,231,182,0.25);
            animation: sunPulse 6s ease-in-out infinite;
        }
        .sun-disc::before {
            content: ""; position: absolute; inset: -38%;
            background: conic-gradient(from 0deg, transparent 0 8deg, rgba(244,231,182,0.22) 8deg 12deg, transparent 12deg 28deg);
            animation: sunRotate 22s linear infinite;
        }
        body.weather-sunny {
            background:
                radial-gradient(circle at 82% 10%, rgba(244,231,182,0.2), transparent 25%),
                linear-gradient(180deg, #17150d 0%, #080807 64%, #000 100%);
        }
        body.weather-sunny .weather-sun-layer { opacity: 0.86; }

        .weather-comfort-layer {
            background:
                linear-gradient(120deg, transparent 0 22%, rgba(216,216,216,0.08) 42%, transparent 62%),
                repeating-linear-gradient(90deg, rgba(244,231,182,0.035) 0 1px, transparent 1px 150px);
        }
        .weather-comfort-layer::before,
        .weather-comfort-layer::after {
            content: ""; position: absolute; left: 8vw; right: 8vw; height: 2px;
            background: linear-gradient(90deg, transparent, rgba(244,231,182,0.5), transparent);
            opacity: 0.55; animation: comfortLine 5.8s ease-in-out infinite;
        }
        .weather-comfort-layer::before { top: 24vh; }
        .weather-comfort-layer::after { bottom: 22vh; animation-delay: 1.8s; }
        body.weather-comfort {
            background:
                linear-gradient(180deg, rgba(244,231,182,0.1), transparent 38%),
                linear-gradient(135deg, #121210 0%, #080807 56%, #000 100%);
        }
        body.weather-comfort .weather-comfort-layer {
            opacity: 0.72;
            animation: comfortBreathe 7s ease-in-out infinite;
        }

        @keyframes rainFall {
            to { transform: translate3d(-70px, 210px, 0); }
        }
        @keyframes cloudDrift {
            to { transform: translateX(10vw) skewX(-8deg); }
        }
        @keyframes sunPulse {
            0%, 100% { transform: scale(0.96); opacity: 0.72; }
            50% { transform: scale(1.03); opacity: 1; }
        }
        @keyframes sunRotate {
            to { transform: rotate(360deg); }
        }
        @keyframes comfortBreathe {
            0%, 100% { filter: brightness(0.96); opacity: 0.6; }
            50% { filter: brightness(1.08); opacity: 0.82; }
        }
        @keyframes comfortLine {
            0%, 100% { transform: translateX(-3vw); opacity: 0.26; }
            50% { transform: translateX(3vw); opacity: 0.68; }
        }
        
        #night-filter {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 5, 0, 0.4); pointer-events: none; z-index: 900;
            opacity: 0; transition: opacity 3s ease-in-out;
        }
        body.night-mode #night-filter { opacity: 1; }
        
        .dashboard {
            display: grid; 
            grid-template-columns: 1.14fr 1fr;
            grid-template-rows: auto 1fr; /* 右上天氣改為 auto，讓出空間給下方 */
            gap: 20px; width: 100%; height: 100%;
            transform: translate(var(--shift-x), var(--shift-y));
            transition: transform 3s ease-in-out;
            position: relative; z-index: 1;
        }

        /* 核心毛玻璃效果 */
        .glass-panel {
            background:
                linear-gradient(180deg, rgba(255,193,77,0.08), transparent 18%),
                var(--glass-bg);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border); 
            border-top: 4px solid var(--station-yellow);
            border-left: 1px solid rgba(255,193,77,0.24);
            border-radius: 10px; box-shadow: var(--glass-shadow);
            padding: 25px; display: flex; flex-direction: column; position: relative;
            transition: all 2s ease;
            overflow: hidden;
        }
        .glass-panel::before {
            content: ""; position: absolute; inset: 0; pointer-events: none;
            background:
                repeating-linear-gradient(0deg, rgba(255,193,77,0.035) 0 1px, transparent 1px 36px),
                repeating-linear-gradient(90deg, transparent 0 44px, rgba(255,255,255,0.026) 44px 45px);
        }
        .glass-panel > * { position: relative; z-index: 1; }
        
        /* 左側：主時鐘 */
        .panel-left { grid-column: 1 / 2; grid-row: 1 / 3; justify-content: center; align-items: center; text-align: center; padding: 32px; }
        .clock-kicker {
            display: inline-flex; align-items: center; gap: 10px; color: var(--accent-gold);
            font-family: 'Roboto'; font-size: clamp(14px, 1.25vw, 20px); font-weight: 700;
            letter-spacing: 4px; text-transform: uppercase; margin-bottom: 18px;
        }
        .clock-kicker::before, .clock-kicker::after {
            content: ""; width: 42px; height: 1px;
            background: linear-gradient(90deg, transparent, currentColor);
        }
        .clock-kicker::after { background: linear-gradient(90deg, currentColor, transparent); }
        .clock-face {
            width: min(96%, 760px); min-height: 46vh; display: grid; justify-items: center; align-content: center;
            padding: 20px 14px 26px; border: 1px solid rgba(255,193,77,0.24);
            background: rgba(0,0,0,0.28); box-shadow: inset 0 0 36px rgba(0,0,0,0.35);
        }
        #clock {
            font-family: 'Roboto'; font-weight: 100; font-size: clamp(116px, 18vw, 270px);
            line-height: 0.86; margin-bottom: 18px; letter-spacing: 0;
            color: var(--station-white);
            text-shadow: 0 5px 22px rgba(0,0,0,0.7), 0 0 30px rgba(255,193,77,0.24);
            animation: clockGlow 7s ease-in-out infinite;
        }
        #date-display {
            width: 100%; font-size: clamp(18px, 2.15vw, 36px); font-weight: 700;
            color: var(--station-yellow); letter-spacing: 3px; margin-bottom: 22px;
            padding: 10px 0; border-top: 1px solid rgba(255,193,77,0.3);
            border-bottom: 1px solid rgba(255,193,77,0.2);
            background: rgba(255,193,77,0.06);
        }
        .hour-progress {
            width: min(78%, 460px); height: 5px; border-radius: 999px; overflow: hidden;
            background: rgba(255,193,77,0.13); box-shadow: inset 0 0 10px rgba(0,0,0,0.55);
            margin-bottom: 30px;
        }
        .hour-progress::before {
            content: ""; display: block; height: 100%; width: var(--hour-progress);
            border-radius: inherit;
            background: linear-gradient(90deg, var(--station-yellow), #fff1b8);
            box-shadow: 0 0 16px rgba(255,193,77,0.45);
            transition: width 0.6s ease;
        }
        
        .status-list { font-size: 1.25vw; color: var(--text-main); margin: 22px 0 20px; display: grid; gap: 10px; text-align: left; width: min(86%, 560px); font-weight: 600;}
        .status-list i { width: 25px; text-align: center; color: var(--theme-blue); }

        .auto-hide { transition: opacity 0.8s ease-in-out; opacity: 1; }
        body.idle .auto-hide { opacity: 0; pointer-events: none; }
        body.low-performance *,
        body.low-performance *::before,
        body.low-performance *::after {
            animation-duration: 0.001ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.001ms !important;
        }
        body.low-performance #weather-ambience,
        body.low-performance #rain-canvas {
            display: none !important;
        }
        .data-state {
            font-size: clamp(11px, 0.78vw, 13px);
            color: var(--text-muted);
            margin-top: 5px;
        }
        .data-state.warning { color: var(--station-amber); }
        .data-state.error { color: var(--station-red); }
        
        /* 左側：控制列 */
        .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: auto; width: 100%; position: relative; z-index: 910; }
        button, .upload-btn { 
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255,255,255,0.18); color: var(--text-main);
            padding: 8px 15px; border-radius: 10px; font-size: 1.1vw; cursor: pointer; transition: 0.2s; 
            display: flex; align-items: center; gap: 8px; font-weight: 500;
        }
        button:hover, .upload-btn:hover { background: rgba(255, 193, 77, 0.16); border-color: rgba(255,193,77,0.5); }
        input[type="time"] { background: rgba(0,0,0,0.42); color: var(--text-main); color-scheme: dark; border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; padding: 6px; outline: none; font-family: 'Roboto'; font-weight: 500;}
        
        /* 右上：天氣 (縮小版) */
        .panel-right-top { grid-column: 2 / 3; grid-row: 1 / 2; padding: 15px 25px; gap: 10px; }
        .weather-header { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .current-temp-block { display: flex; align-items: center; gap: 15px; }
        #current-temp { font-family: 'Roboto'; font-size: 4.4vw; font-weight: 300; line-height: 1; text-shadow: 0 0 22px rgba(255,193,77,0.18); }
        #current-condition { font-size: 3vw; line-height: 1; color: var(--accent-gold); }
        .weather-details { font-size: 1.1vw; color: var(--text-muted); text-align: right; display: flex; flex-direction: column; gap: 3px; font-weight: 500;}
        
        .forecast-grid { display: flex; justify-content: space-between; gap: 8px; }
        .forecast-item { display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; flex: 1; padding: 8px 5px; gap: 5px; }
        .forecast-item .day { font-size: 1vw; color: var(--text-muted); font-weight: 500;}
        .forecast-item .icon { font-size: 1.5vw; }
        .forecast-item .temp { font-family: 'Roboto'; font-size: 1.1vw; font-weight: 500; }
        .forecast-item .details { font-size: 0.8vw; color: var(--text-muted); text-align: center; display: flex; flex-direction: column; gap: 2px; }

        /* 右下：新聞與股市滑動區 */
        .panel-right-bottom { grid-column: 2 / 3; grid-row: 2 / 3; display: flex; flex-direction: column; overflow: hidden; padding: 20px; }
        
        .module-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        
        /* 標籤切換器 (指示點) */
        .tabs { display: flex; gap: 15px; font-size: 1.4vw; font-weight: 700; color: var(--text-muted); }
        .tab { cursor: pointer; transition: 0.3s; }
        .tab.active { color: var(--accent-gold); text-shadow: 0 0 12px rgba(255,193,77,0.38); }
        
        .news-lang-select { background: rgba(0, 0, 0, 0.3); color: var(--text-main); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 4px 10px; font-size: 1vw; cursor: pointer; outline: none; transition: 0.2s; }
        
        /* 滑動軌道 (新聞與股市切換) */
        .slider-viewport { flex: 1; overflow: hidden; position: relative; width: 100%; cursor: grab; }
        .slider-viewport:active { cursor: grabbing; }
        .slider-track { display: flex; width: 200%; height: 100%; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        .slide-page { width: 50%; height: 100%; display: flex; flex-direction: column; padding: 0 5px; box-sizing: border-box; }
        
        /* ================= 新聞順暢交叉淡入淡出動畫 ================= */
        #news-container-wrapper { position: relative; width: 100%; height: 100%; }
        .news-grid-page { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 15px;
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        /* 新頁面：從下方稍微浮上來並淡入 */
        .page-enter { opacity: 0; transform: translateY(20px); }
        .page-enter-active { opacity: 1; transform: translateY(0); }
        /* 舊頁面：往上方稍微滑去並淡出 */
        .page-exit-active { opacity: 0; transform: translateY(-20px); pointer-events: none; }
        /* ========================================================== */

        /* 網格卡片共用樣式 */
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 15px; flex: 1; }
        .data-card {
            background: #0a0d10;
            border: 1px solid rgba(255,193,77,0.2); border-radius: 8px; padding: 18px; color: var(--text-main);
            display: flex; flex-direction: column; justify-content: center;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.02);
        }
        
        .news-card span { font-size: 1.45vw; font-weight: 500; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* 股市卡片特製樣式 */
        .stock-card { justify-content: space-between; }
        .stock-name { font-size: 1.25vw; color: var(--station-yellow); font-weight: 700; margin-bottom: 5px; }
        .stock-price { font-family: 'Roboto'; font-size: 2.35vw; font-weight: 700; }
        .stock-change { font-family: 'Roboto'; font-size: 1.1vw; font-weight: 500; display: flex; align-items: center; gap: 5px; margin-top: 5px; }
        .up { color: #ff5252; }
        .down { color: #4caf50; }

        @keyframes clockGlow {
            0%, 100% { text-shadow: 0 5px 22px rgba(0,0,0,0.7), 0 0 24px rgba(255,193,77,0.16); }
            50% { text-shadow: 0 5px 22px rgba(0,0,0,0.7), 0 0 44px rgba(255,193,77,0.3); }
        }

        @media (max-width: 820px) {
            body { padding: 16px; overflow: auto; height: auto; min-height: 100vh; }
            .dashboard { grid-template-columns: 1fr; grid-template-rows: auto auto auto; height: auto; min-height: calc(100vh - 32px); }
            .panel-left, .panel-right-top, .panel-right-bottom { grid-column: 1; grid-row: auto; }
            .panel-left { min-height: 58vh; }
            .panel-right-bottom { min-height: 420px; }
            .status-list { font-size: 15px; }
            button, .upload-btn, .news-lang-select { font-size: 14px; }
            #current-temp { font-size: 52px; }
            #current-condition { font-size: 38px; }
            .forecast-item .day, .forecast-item .temp { font-size: 13px; }
            .forecast-item .details { font-size: 11px; }
            .tabs { font-size: 18px; }
            .news-card span { font-size: 16px; }
        }

        /* 警報畫面 */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); text-align: center; }
        @keyframes pulseRed { 0% { background: rgba(220, 53, 69, 0.85); } 50% { background: rgba(140, 20, 30, 0.9); } 100% { background: rgba(220, 53, 69, 0.85); } }
        .eq-active { animation: pulseRed 1s infinite !important; }
        @keyframes pulseBlue { 0% { background: rgba(13, 71, 161, 0.85); } 50% { background: rgba(10, 35, 80, 0.9); } 100% { background: rgba(13, 71, 161, 0.85); } }
        .alarm-active { animation: pulseBlue 1.5s infinite !important; }
        .overlay h1 { font-size: 6vw; margin: 0 0 20px; font-weight: 700; display: flex; align-items: center; gap: 20px; color: white;}
        .overlay p { font-size: 2.5vw; margin-bottom: 40px; line-height: 1.5; color: white;}
        .overlay button { font-size: 1.8vw; padding: 15px 50px; background: white; color: black; border-radius: 50px; font-weight: bold; cursor: pointer; }

        /* 整點動畫：車站廣播風 */
        #hourly-overlay {
            position: fixed; inset: 0; z-index: 950; display: none; place-items: center;
            overflow: hidden; background:
                radial-gradient(circle at 50% 0%, rgba(255,193,77,0.26), transparent 30%),
                repeating-linear-gradient(0deg, rgba(255,193,77,0.05) 0 2px, transparent 2px 24px),
                rgba(5, 6, 8, 0.84);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            opacity: 0; pointer-events: none;
        }
        #hourly-overlay.show { display: grid; animation: hourlyFade 6.2s ease forwards; }
        .station-lightline {
            position: absolute; z-index: 1; height: 4px; width: 42vw; min-width: 280px;
            background: linear-gradient(90deg, transparent, rgba(255,193,77,0.9), transparent);
            opacity: 0; filter: blur(1px);
            animation: platformSweep 2.2s ease-out infinite;
        }
        .line-a { top: 23%; left: -12%; animation-delay: 0.05s; }
        .line-b { top: 52%; right: -12%; animation-delay: 0.55s; }
        .line-c { bottom: 18%; left: 8%; animation-delay: 1.1s; }
        .hourly-card {
            position: relative; width: min(760px, 82vw); aspect-ratio: 16 / 9;
            border: 1px solid rgba(255,193,77,0.52); border-top: 8px solid var(--station-yellow); border-radius: 8px;
            background:
                linear-gradient(180deg, rgba(255,193,77,0.1), transparent 22%),
                #090b0d;
            box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 0 40px rgba(255,193,77,0.08);
            display: grid; place-items: center; overflow: hidden;
            transform: translateY(18px) scale(0.96);
            animation: dateCardPop 6.2s cubic-bezier(0.2, 1, 0.2, 1) forwards;
        }
        .hourly-card::before {
            content: ""; position: absolute; inset: -40%;
            background: repeating-linear-gradient(90deg, transparent 0 40px, rgba(255,193,77,0.06) 40px 42px);
            opacity: 1;
        }
        .hourly-card::after {
            content: ""; position: absolute; inset: 12px; border-radius: 4px;
            border: 1px solid rgba(255,193,77,0.22);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.45);
        }
        .hourly-shine {
            position: absolute; z-index: 4; inset: -20% auto -20% -28%; width: 18%;
            background: linear-gradient(90deg, transparent, rgba(255,193,77,0.34), transparent);
            transform: skewX(-18deg); animation: shineCut 2.4s ease-in-out infinite;
        }
        .hourly-content { position: relative; z-index: 2; text-align: center; display: grid; gap: 16px; justify-items: center; }
        .hourly-kicker {
            font-family: 'Roboto'; font-size: clamp(14px, 1.6vw, 22px); letter-spacing: 6px;
            color: var(--station-yellow); text-transform: uppercase;
        }
        #hourly-time {
            font-family: 'Roboto'; font-size: clamp(76px, 11vw, 156px); font-weight: 100;
            line-height: 0.9; text-shadow: 0 8px 30px rgba(255, 193, 77, 0.28);
        }
        .hourly-title { font-size: clamp(26px, 4vw, 54px); font-weight: 700; }
        .hourly-subtitle { font-size: clamp(16px, 2vw, 26px); color: rgba(255,255,255,0.78); }
        .station-mark {
            position: absolute; z-index: 3; color: var(--station-yellow); filter: drop-shadow(0 6px 14px rgba(255,193,77,0.36));
            animation: stationMarkPulse 2.4s ease-in-out infinite;
        }
        .mark-a { left: 14%; top: 18%; font-size: 2.6vw; animation-delay: 0s; }
        .mark-b { right: 18%; top: 22%; font-size: 2.3vw; animation-delay: 0.4s; }
        .mark-c { left: 22%; bottom: 18%; font-size: 2vw; animation-delay: 0.8s; }
        .date-spark {
            position: absolute; z-index: 3; width: 9px; height: 9px; border-radius: 50%;
            background: white; box-shadow: 0 0 18px white; animation: sparklePop 1.8s ease-in-out infinite;
        }
        .spark-a { left: 29%; top: 28%; animation-delay: 0.1s; }
        .spark-b { right: 30%; top: 34%; animation-delay: 0.6s; }
        .spark-c { left: 62%; bottom: 22%; animation-delay: 1.1s; }
        @keyframes hourlyFade {
            0% { opacity: 0; }
            12%, 78% { opacity: 1; }
            100% { opacity: 0; }
        }
        @keyframes dateCardPop {
            0% { transform: translateY(22px) scale(0.94); }
            14%, 78% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-10px) scale(0.98); }
        }
        @keyframes stationMarkPulse {
            0%, 100% { transform: scale(1); opacity: 0.65; }
            50% { transform: scale(1.12); opacity: 1; }
        }
        @keyframes platformSweep {
            0% { transform: translateX(-40vw); opacity: 0; }
            20%, 55% { opacity: 0.9; }
            100% { transform: translateX(92vw); opacity: 0; }
        }
        @keyframes shineCut {
            0%, 45% { left: -32%; opacity: 0; }
            56% { opacity: 0.9; }
            78%, 100% { left: 112%; opacity: 0; }
        }
        @keyframes sparklePop {
            0%, 100% { transform: scale(0.2); opacity: 0.1; }
            50% { transform: scale(1.4); opacity: 1; }
        }

        /* 黑白車站時刻表風格 */
        :root {
            --board-bg: #050505;
            --board-bg-strong: #000000;
            --board-border: rgba(245, 245, 245, 0.38);
            --board-shadow: 0 18px 56px rgba(0, 0, 0, 0.78);
            --station-yellow: #f4e7b6;
            --station-amber: #d8c789;
            --station-white: #f7f7f3;
            --station-muted: #9d9d9d;
            --station-green: #d8d8d8;
            --station-red: #ffffff;
            --glass-bg: #070707;
            --glass-border: rgba(255,255,255,0.32);
            --theme-blue: var(--station-white);
            --accent-pink: var(--station-white);
            --accent-gold: var(--station-yellow);
            --accent-mint: var(--station-white);
            --text-main: var(--station-white);
            --text-muted: var(--station-muted);
        }

        body {
            background:
                radial-gradient(circle at 50% -10%, rgba(244,231,182,0.18), transparent 34%),
                linear-gradient(180deg, #151515 0%, #060606 55%, #000 100%);
        }
        body::before {
            background:
                repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 110px),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.026) 0 1px, transparent 1px 44px);
        }

        .dashboard {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: minmax(360px, 1.15fr) minmax(260px, 0.85fr);
            gap: 18px;
        }

        .glass-panel {
            background: linear-gradient(180deg, rgba(255,255,255,0.055), transparent 22%), #050505;
            border: 1px solid rgba(255,255,255,0.34);
            border-top: 5px solid rgba(244,231,182,0.92);
            border-radius: 6px;
            box-shadow: var(--board-shadow);
        }
        .glass-panel::before {
            background:
                repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 38px),
                repeating-linear-gradient(90deg, transparent 0 64px, rgba(255,255,255,0.02) 64px 65px);
        }

        .panel-left {
            grid-column: 1 / 3;
            grid-row: 1 / 2;
            justify-content: center;
            padding: 28px 34px;
        }
        .panel-right-top {
            grid-column: 1 / 2;
            grid-row: 2 / 3;
        }
        .panel-right-bottom {
            grid-column: 2 / 3;
            grid-row: 2 / 3;
        }

        .clock-kicker { display: none; }
        .clock-face {
            width: min(96%, 1120px);
            min-height: 0;
            padding: 0;
            border: none;
            background: transparent;
            box-shadow: none;
        }

        #clock {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(10px, 1.4vw, 22px);
            width: 100%;
            margin: 0 0 18px;
            font-family: 'Roboto', sans-serif;
            animation: none;
            text-shadow: none;
        }
        .flip-unit {
            position: relative;
            display: grid;
            place-items: center;
            width: clamp(150px, 22vw, 330px);
            height: clamp(132px, 18vw, 260px);
            border: 1px solid rgba(255,255,255,0.44);
            border-radius: 5px;
            background:
                linear-gradient(180deg, #1a1a1a 0%, #0b0b0b 49%, #030303 50%, #111 100%);
            color: #f7f7f3;
            font-size: clamp(104px, 16vw, 235px);
            font-weight: 100;
            line-height: 1;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), inset 0 -18px 34px rgba(0,0,0,0.48), 0 12px 38px rgba(0,0,0,0.72);
            transform-style: preserve-3d;
            overflow: hidden;
        }
        .flip-unit::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: rgba(255,255,255,0.25);
            box-shadow: 0 -1px 0 rgba(0,0,0,0.8), 0 1px 0 rgba(0,0,0,0.8);
            z-index: 2;
        }
        .flip-unit::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(255,255,255,0.11), transparent 18%, transparent 82%, rgba(255,255,255,0.08));
            pointer-events: none;
        }
        .flip-unit.flip {
            animation: flipPage 0.58s cubic-bezier(0.2, 0.8, 0.25, 1);
        }
        .flip-separator {
            color: #f7f7f3;
            font-family: 'Roboto', sans-serif;
            font-size: clamp(96px, 12vw, 190px);
            font-weight: 100;
            transform: translateY(-0.04em);
            opacity: 0.86;
        }

        #date-display {
            width: min(72%, 780px);
            color: #f4e7b6;
            background: #050505;
            border: 1px solid rgba(244,231,182,0.34);
            font-size: clamp(20px, 2vw, 32px);
            letter-spacing: 4px;
            margin-bottom: 14px;
        }
        .hour-progress {
            width: min(62%, 680px);
            height: 4px;
            background: rgba(255,255,255,0.08);
            margin-bottom: 16px;
        }
        .hour-progress::before {
            background: linear-gradient(90deg, #f7f7f3, #f4e7b6);
            box-shadow: 0 0 14px rgba(244,231,182,0.36);
        }

        .status-list {
            width: min(88%, 880px);
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin: 10px 0 12px;
            font-size: clamp(15px, 1.2vw, 20px);
        }
        .status-list > div {
            border: 1px solid rgba(255,255,255,0.18);
            padding: 10px 12px;
            background: rgba(255,255,255,0.035);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .status-list i { color: #f4e7b6; }
        .controls { justify-content: center; margin-top: 4px; }

        .weather-header {
            align-items: center;
            border-bottom-color: rgba(255,255,255,0.18);
        }
        #current-temp {
            font-size: clamp(64px, 7vw, 116px);
            color: #f7f7f3;
            text-shadow: none;
        }
        #current-condition {
            color: #f4e7b6;
            font-size: clamp(42px, 5vw, 78px);
        }
        .weather-details {
            color: #f7f7f3;
            font-size: clamp(16px, 1.25vw, 22px);
        }
        .forecast-item {
            border-radius: 4px;
            border-color: rgba(255,255,255,0.2);
            background: #060606;
        }
        .forecast-item .day,
        .forecast-item .temp {
            color: #f7f7f3;
            font-size: clamp(13px, 1.1vw, 18px);
        }

        .tabs {
            font-size: clamp(18px, 1.5vw, 24px);
            color: #f7f7f3;
        }
        .tab.active {
            color: #f4e7b6;
            text-shadow: none;
        }
        .news-lang-select {
            border-radius: 3px;
            border-color: rgba(255,255,255,0.3);
            background: #050505;
            font-size: clamp(14px, 1vw, 18px);
        }
        .data-card {
            border-color: rgba(255,255,255,0.24);
            border-radius: 4px;
            background: #030303;
        }
        .news-card span {
            font-size: clamp(17px, 1.45vw, 24px);
            font-weight: 700;
            line-height: 1.45;
        }
        .stock-name {
            color: #f4e7b6;
            font-size: clamp(15px, 1.2vw, 20px);
        }
        .stock-price {
            font-size: clamp(30px, 3vw, 52px);
        }
        .up, .down { color: #f7f7f3; }

        @keyframes flipPage {
            0% { transform: rotateX(0deg); filter: brightness(1); }
            45% { transform: rotateX(-82deg); filter: brightness(0.74); }
            100% { transform: rotateX(0deg); filter: brightness(1); }
        }

<body>
    <div id="night-filter"></div>
    <div id="weather-ambience" aria-hidden="true">

                <label class="upload-btn"><i class="fa-regular fa-image"></i> 背景<input type="file" id="bgInput" accept="image/*" style="display: none;"></label>
                
                <div style="display: flex; gap: 5px; width: 100%; justify-content: center; margin-top: 10px;">
                    <input type="time" id="alarmTimeInput">
                    <button id="setAlarmBtn"><i class="fa-solid fa-check"></i></button>
                    <button id="cancelAlarmBtn" style="display:none; color: #ff5252;"><i class="fa-solid fa-xmark"></i></button>

        <div class="glass-panel panel-right-top">

                                <div class="data-card news-card"><span>載入中...</span></div>
                                <div class="data-card news-card"><span>載入中...</span></div>
                                <div class="data-card news-card"><span>載入中...</span></div>
                                <div class="data-card news-card"><span>載入中...</span></div>

                        <div class="grid-container" id="stock-grid">
                            <div class="data-card stock-card"><span>股市載入中...</span></div>
                            <div class="data-card stock-card"><span>股市載入中...</span></div>
                            <div class="data-card stock-card"><span>股市載入中...</span></div>

    <div id="eq-overlay" class="overlay">
        <h1><i class="fa-solid fa-triangle-exclamation"></i> 氣象署地震速報</h1>

        <button id="dismissEqBtn">解除警報</button>
    </div>
    <div id="alarm-overlay" class="overlay">
        <h1><i class="fa-regular fa-bell"></i> 時間到！</h1>
        <button id="dismissAlarmBtn">關閉鬧鐘</button>
    </div>
    <div id="hourly-overlay" aria-hidden="true">
        <span class="station-lightline line-a"></span>
        <span class="station-lightline line-b"></span>
        <span class="station-lightline line-c"></span>
        <div class="hourly-card">
            <span class="hourly-shine"></span>
            <i class="fa-solid fa-train-subway station-mark mark-a"></i>
            <i class="fa-solid fa-clock station-mark mark-b"></i>
            <i class="fa-solid fa-circle-info station-mark mark-c"></i>
            <span class="date-spark spark-a"></span>
            <span class="date-spark spark-b"></span>
            <span class="date-spark spark-c"></span>
            <div class="hourly-content">
                <div class="hourly-kicker">ON THE HOUR</div>
                <div id="hourly-time">00:00</div>
                <div class="hourly-title">整點播報</div>
                <div class="hourly-subtitle">請確認目前時刻與最新資訊</div>
            </div>
        </div>
    </div>

    <script>
        let audioCtx;
        let audioReady = false;

        const performancePreference = localStorage.getItem('smartDisplay_lowPerformance');
        let lowPerformanceMode = performancePreference === null
            ? Boolean(
                window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ||
                (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) ||
                (navigator.deviceMemory && navigator.deviceMemory <= 4)
            )
            : performancePreference === 'true';

        function applyPerformanceMode() {
            document.body.classList.toggle('low-performance', lowPerformanceMode);
            const button = document.getElementById('performanceBtn');
            button.innerHTML = lowPerformanceMode
                ? '<i class="fa-solid fa-leaf"></i> 省電'
                : '<i class="fa-solid fa-gauge-high"></i>';
            button.title = lowPerformanceMode ? '低效能模式已啟用' : '標準顯示模式';
        }

        document.getElementById('performanceBtn').addEventListener('click', () => {
            lowPerformanceMode = !lowPerformanceMode;
            localStorage.setItem('smartDisplay_lowPerformance', String(lowPerformanceMode));
            applyPerformanceMode();
            if (lowPerformanceMode) pauseRainAnimation();
            else if (document.body.classList.contains('weather-rain')) {
                updateRainAnimation('rain', Number(document.body.dataset.rain12h || 50));
            }
        });
        applyPerformanceMode();

        function formatUpdatedAt(value) {
            if (!value) return '更新時間未知';
            return `更新於 ${new Date(value).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })}`;
        }

        function prepareAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            audioReady = true;
        }

        window.addEventListener('pointerdown', prepareAudio, { once: true });
        window.addEventListener('keydown', prepareAudio, { once: true });

        // --- 防烙印 ---
        function applyPixelShift() {
            if (lowPerformanceMode) return;
            document.documentElement.style.setProperty('--shift-x', (Math.floor(Math.random() * 9) - 4) + 'px');
            document.documentElement.style.setProperty('--shift-y', (Math.floor(Math.random() * 9) - 4) + 'px');
        }
        setInterval(applyPixelShift, 60000);

        // --- UI 自動隱藏 ---
        let idleTimer;
        function resetIdleTimer() {
            document.body.classList.remove('idle');
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => document.body.classList.add('idle'), 5000); 
        }
        window.addEventListener('mousemove', resetIdleTimer); window.addEventListener('touchstart', resetIdleTimer); window.addEventListener('click', resetIdleTimer);
        resetIdleTimer();

        // --- 全螢幕 ---
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(()=>{});
                fullscreenBtn.innerHTML = '<i class="fa-solid fa-compress"></i>';
            } else {
                document.exitFullscreen();
                fullscreenBtn.innerHTML = '<i class="fa-solid fa-expand"></i>';
            }
        });

        // --- 時鐘與夜間模式 (還原為簡約寫法) ---
        let targetAlarmTime = null, isAlarmRinging = false;
        let lastHourlyKey = '';
        let lastHourText = '';
        let lastMinuteText = '';
        function updateFlipUnit(id, value, previousValue) {
            const el = document.getElementById(id);
            if (previousValue === '') {
                el.textContent = value;
                return value;
            }
            if (previousValue !== value) {
                el.textContent = value;
                el.classList.remove('flip');
                void el.offsetWidth;
                el.classList.add('flip');
            }
            return value;
        }

        function updateClock() {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, '0'), mm = String(now.getMinutes()).padStart(2, '0'), ss = String(now.getSeconds()).padStart(2, '0');
            lastHourText = updateFlipUnit('hour-display', hh, lastHourText);
            lastMinuteText = updateFlipUnit('minute-display', mm, lastMinuteText);
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const weekdayEn = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'][now.getDay()];
            const weekdayZh = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][now.getDay()];
            document.getElementById('date-display').textContent = `${month}.${day} ${weekdayEn} / ${weekdayZh}`;
            document.documentElement.style.setProperty('--hour-progress', `${((now.getMinutes() * 60 + now.getSeconds()) / 3600) * 100}%`);
            
            const hour = now.getHours();
            if (hour >= 23 || hour < 6) document.body.classList.add('night-mode');
            else document.body.classList.remove('night-mode');

            if (targetAlarmTime === `${hh}:${mm}` && ss === '00' && !isAlarmRinging) triggerAlarm();

            const hourlyKey = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}-${hh}`;
            if (mm === '00' && ss === '00' && hourlyKey !== lastHourlyKey) {
                lastHourlyKey = hourlyKey;
                triggerHourlyAnimation(`${hh}:00`);
            }
        }
        setInterval(updateClock, 1000); updateClock();

        function triggerHourlyAnimation(timeText) {
            const overlay = document.getElementById('hourly-overlay');
            document.getElementById('hourly-time').textContent = timeText;
            overlay.classList.remove('show');
            void overlay.offsetWidth;
            overlay.classList.add('show');
            playTone('sine', 660, 0.16);
            setTimeout(() => playTone('sine', 880, 0.18), 180);
            setTimeout(() => overlay.classList.remove('show'), 6300);
        }

        // --- 鬧鐘與背景記憶 ---
        const setAlarmBtn = document.getElementById('setAlarmBtn'), cancelAlarmBtn = document.getElementById('cancelAlarmBtn'), alarmTimeInput = document.getElementById('alarmTimeInput');
        let alarmSoundInterval;
        const savedAlarm = localStorage.getItem('smartDisplay_alarm');
        if (savedAlarm) {
            targetAlarmTime = savedAlarm; document.getElementById('alarmStatus').style.display = 'block'; document.getElementById('alarmStatus').innerHTML = `<i class="fa-regular fa-bell"></i> ${targetAlarmTime}`;
            setAlarmBtn.style.display = 'none'; cancelAlarmBtn.style.display = 'flex'; alarmTimeInput.style.display = 'none';
        }
        setAlarmBtn.addEventListener('click', () => {
            if (alarmTimeInput.value) {
                targetAlarmTime = alarmTimeInput.value; localStorage.setItem('smartDisplay_alarm', targetAlarmTime);
                document.getElementById('alarmStatus').style.display = 'block'; document.getElementById('alarmStatus').innerHTML = `<i class="fa-regular fa-bell"></i> ${targetAlarmTime}`;
                setAlarmBtn.style.display = 'none'; cancelAlarmBtn.style.display = 'flex'; alarmTimeInput.style.display = 'none';
            }
        });
        cancelAlarmBtn.addEventListener('click', () => {
            targetAlarmTime = null; localStorage.removeItem('smartDisplay_alarm'); document.getElementById('alarmStatus').style.display = 'none';
            setAlarmBtn.style.display = 'flex'; cancelAlarmBtn.style.display = 'none'; alarmTimeInput.style.display = 'block'; alarmTimeInput.value = '';
        });

        const savedBg = localStorage.getItem('smartDisplay_bg');
        if (savedBg) { document.body.style.backgroundImage = `url(${savedBg})`; }
        document.getElementById('bgInput').addEventListener('change', e => {
            if (e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = ev => {
                    document.body.style.backgroundImage = `url(${ev.target.result})`;
                    try {
                        localStorage.setItem('smartDisplay_bg', ev.target.result);
                    } catch (err) {
                        document.getElementById('wakeStatus').innerHTML = '<span style="color:#ff9f1c;"><i class="fa-solid fa-image"></i> 背景已套用，但圖片過大無法保存</span>';
                    }
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        // ==========================================
        // 👆 滑動模組邏輯 (News <-> Stocks)
        // ==========================================
        let currentSlide = 0; // 0=News, 1=Stocks
        const track = document.getElementById('slider-track');
        const tabNews = document.getElementById('tab-news');
        const tabStocks = document.getElementById('tab-stocks');
        const langSelect = document.getElementById('newsLangSelect');

        function slideTo(index) {
            currentSlide = index;
            track.style.transform = `translateX(-${index * 50}%)`;
            if(index === 0) {
                tabNews.classList.add('active'); tabStocks.classList.remove('active');
                langSelect.style.display = 'block';
            } else {
                tabStocks.classList.add('active'); tabNews.classList.remove('active');
                langSelect.style.display = 'none';
            }
        }

        // 觸控滑動偵測
        let startX = 0, isDragging = false;
        const viewport = document.getElementById('slider-viewport');
        
        viewport.addEventListener('mousedown', e => { isDragging = true; startX = e.pageX; });
        viewport.addEventListener('touchstart', e => { isDragging = true; startX = e.touches[0].clientX; });
        
        window.addEventListener('mouseup', e => { if(isDragging) handleSwipe(e.pageX); isDragging = false; });
        window.addEventListener('touchend', e => { if(isDragging) handleSwipe(e.changedTouches[0].clientX); isDragging = false; });

        function handleSwipe(endX) {
            const diff = startX - endX;
            if (diff > 50 && currentSlide === 0) slideTo(1); // 左滑去股市
            else if (diff < -50 && currentSlide === 1) slideTo(0); // 右滑回新聞
        }

        // ==========================================
        // 📰 新聞 API (平滑流暢動畫版)
        // ==========================================
        let newsList = [], currentNewsPage = 0, newsInterval;
        const savedLangRaw = localStorage.getItem('smartDisplay_newsLang') || 'zh';
        const savedLang = ['zh', 'en'].includes(savedLangRaw) ? savedLangRaw : 'zh';
        if (savedLangRaw !== savedLang) localStorage.setItem('smartDisplay_newsLang', savedLang);
        langSelect.value = savedLang;

        async function fetchNews(lang) {
            try {
                const res = await fetch(`/api/news/${lang}`);
                const data = await res.json();
                if (data.status === 'ok' && data.items.length > 0) {
                    newsList = data.items;
                    currentNewsPage = 0;
                    showNextNews();
                    if (data.stale) showNewsNotice(data.message || `顯示舊資料・${formatUpdatedAt(data.updatedAt)}`);
                    if(newsInterval) clearInterval(newsInterval);
                    newsInterval = setInterval(showNextNews, lowPerformanceMode ? 30000 : 10000);
                    return;
                }
                showNewsMessage(data.message || '新聞暫時無法取得');
            } catch (err) {
                showNewsMessage('網路連線不穩，新聞稍後再試');
            }
        }

        function showNewsNotice(message) {
            const wrapper = document.getElementById('news-container-wrapper');
            wrapper.querySelectorAll('.data-state').forEach(node => node.remove());
            const notice = document.createElement('div');
            notice.className = 'data-state warning';
            notice.textContent = message;
            wrapper.prepend(notice);
        }

        function showNewsMessage(message) {
            const wrapper = document.getElementById('news-container-wrapper');
            wrapper.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'news-grid-page page-enter-active';
            const card = document.createElement('div');
            card.className = 'data-card news-card';
            const span = document.createElement('span');
            span.textContent = message;
            card.appendChild(span);
            grid.appendChild(card);
            wrapper.appendChild(grid);
        }
        
        function showNextNews() {
            if(newsList.length === 0) return;
            
            const wrapper = document.getElementById('news-container-wrapper');
            const oldGrid = wrapper.querySelector('.news-grid-page');
            
            // 建立新的網格頁面，並設定在「準備滑入」的狀態
            const newGrid = document.createElement('div');
            newGrid.className = 'news-grid-page page-enter';
            
            // 填入四則新聞資料
            for(let i=0; i<4; i++) {
                let index = (currentNewsPage * 4 + i) % newsList.length;
                const card = document.createElement('div');
                card.className = 'data-card news-card';
                const span = document.createElement('span');
                span.textContent = newsList[index];
                card.appendChild(span);
                newGrid.appendChild(card);
            }
            wrapper.appendChild(newGrid);
            
            // 強制瀏覽器重繪 (Reflow)，確保動畫生效
            void newGrid.offsetWidth;
            
            // 新網格啟動淡入上浮
            newGrid.classList.remove('page-enter');
            newGrid.classList.add('page-enter-active');
            
            // 舊網格啟動淡出上滑
            if(oldGrid) {
                // 如果是初始載入狀態則不用加 exit 動畫
                if (oldGrid.id !== 'initial-news-loader') {
                    oldGrid.classList.remove('page-enter-active');
                }
                oldGrid.classList.add('page-exit-active');
                
                // 動畫結束後(0.8秒)將舊節點移除
                setTimeout(() => { if (oldGrid.parentNode) oldGrid.remove(); }, 800);
            }
            
            currentNewsPage++;
        }

        langSelect.addEventListener('change', (e) => {
            const lang = e.target.value; localStorage.setItem('smartDisplay_newsLang', lang); 
            fetchNews(lang);
        });
        
        fetchNews(savedLang); setInterval(() => fetchNews(langSelect.value), 60 * 60 * 1000);

        // ==========================================
        // 📈 股市 API
        // ==========================================
        function showStockMessage(message) {
            document.getElementById('stock-grid').innerHTML = `<div class="data-card stock-card"><span>${message}</span></div>`;
        }

        async function fetchStocks() {
            try {
                const res = await fetch('/api/stocks');
                const data = await res.json();
                if (data.status === 'ok') {
                    const grid = document.getElementById('stock-grid');
                    grid.innerHTML = '';
                    data.items.forEach(stock => {
                        // 台灣習慣：大於0紅色，小於0綠色
                        const price = Number(stock.price);
                        const change = Number(stock.change);
                        const changePercent = Number(stock.changePercent);
                        if (!Number.isFinite(price) || !Number.isFinite(change) || !Number.isFinite(changePercent)) return;
                        const isUp = change > 0;
                        const colorClass = isUp ? 'up' : 'down';
                        const icon = isUp ? '<i class="fa-solid fa-caret-up"></i>' : '<i class="fa-solid fa-caret-down"></i>';
                        const sign = isUp ? '+' : '';
                        
                        grid.innerHTML += `
                            <div class="data-card stock-card">
                                <div class="stock-name">${stock.name}</div>
                                <div class="stock-price">${price.toFixed(2)}</div>
                                <div class="stock-change ${colorClass}">
                                    ${icon} ${sign}${change.toFixed(2)} (${sign}${changePercent.toFixed(2)}%)
                                </div>
                            </div>
                        `;
                    });
                    if (data.stale) {
                        const notice = document.createElement('div');
                        notice.className = 'data-state warning';
                        notice.textContent = data.message || `顯示舊資料・${formatUpdatedAt(data.updatedAt)}`;
                        grid.prepend(notice);
                    }
                    return;
                }
                showStockMessage(data.message || '股市暫時無法取得');
            } catch (err) {
                showStockMessage('網路連線不穩，股市稍後再試');
            }
        }
        fetchStocks(); setInterval(fetchStocks, lowPerformanceMode ? 15 * 60 * 1000 : 5 * 60 * 1000);

        // --- 天氣與定位 ---
        function getIconHtml(code) {
            if (code === 0) return `<i class="fa-solid fa-sun" style="color: var(--theme-blue);"></i>`; 
            if (code <= 3) return `<i class="fa-solid fa-cloud-sun" style="color: var(--theme-blue);"></i>`; 
            if (code >= 45 && code <= 48) return `<i class="fa-solid fa-smog" style="color: var(--text-muted);"></i>`;
            if (code >= 51 && code <= 67) return `<i class="fa-solid fa-cloud-rain" style="color: var(--theme-blue);"></i>`; 
            if (code >= 71 && code <= 77) return `<i class="fa-solid fa-snowflake" style="color: var(--text-main);"></i>`; 
            if (code >= 95) return `<i class="fa-solid fa-cloud-bolt" style="color: #9b59b6;"></i>`; 
            return `<i class="fa-solid fa-cloud" style="color: var(--text-muted);"></i>`;
        }

        const weatherMoodClasses = ['weather-rain', 'weather-cloudy', 'weather-sunny', 'weather-comfort'];
        const rainCanvas = document.getElementById('rain-canvas');
        const rainCtx = rainCanvas?.getContext('2d');
        let rainDrops = [];
        let rainAnimationFrame = null;
        let rainLastTime = 0;
        let rainStrength = 0.5;
        const autoReloadMs = 12 * 60 * 60 * 1000;

        function resizeRainCanvas() {
            if (!rainCanvas || !rainCtx) return;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const width = window.innerWidth;
            const height = window.innerHeight;
            rainCanvas.width = Math.round(width * dpr);
            rainCanvas.height = Math.round(height * dpr);
            rainCanvas.style.width = `${width}px`;
            rainCanvas.style.height = `${height}px`;
            rainCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            buildRainDrops();
        }

        function buildRainDrops() {
            if (!rainCanvas || !rainCtx) return;
            const width = window.innerWidth;
            const height = window.innerHeight;
            const density = lowPerformanceMode ? 0.2 : 1;
            const count = Math.round((width * height / 9000) * (0.45 + rainStrength * 1.35) * density);
            rainDrops = Array.from({ length: count }, () => ({
                x: Math.random() * width,
                y: Math.random() * height,
                length: 18 + Math.random() * 34,
                speed: 520 + Math.random() * 520 + rainStrength * 260,
                drift: -110 - Math.random() * 90,
                alpha: 0.2 + Math.random() * 0.36
            }));
            window.smartDisplayRainState = {
                ...(window.smartDisplayRainState || {}),
                drops: rainDrops.length,
                strength: rainStrength
            };
        }

        function drawRain(timestamp = 0) {
            if (!rainCanvas || !rainCtx || document.hidden || !document.body.classList.contains('weather-rain')) {
                rainAnimationFrame = null;
                window.smartDisplayRainState = {
                    ...(window.smartDisplayRainState || {}),
                    running: false
                };
                return;
            }
            const width = window.innerWidth;
            const height = window.innerHeight;
            const delta = Math.min(0.04, (timestamp - rainLastTime) / 1000 || 0.016);
            rainLastTime = timestamp;
            rainCtx.clearRect(0, 0, width, height);
            rainCtx.lineWidth = 1.3;
            rainCtx.lineCap = 'round';

            for (const drop of rainDrops) {
                drop.x += drop.drift * delta;
                drop.y += drop.speed * delta;

                if (drop.y - drop.length > height || drop.x < -80) {
                    drop.x = Math.random() * (width + 160);
                    drop.y = -Math.random() * height * 0.25;
                }

                rainCtx.strokeStyle = `rgba(225,232,238,${drop.alpha})`;
                rainCtx.beginPath();
                rainCtx.moveTo(drop.x, drop.y);
                rainCtx.lineTo(drop.x + drop.drift * 0.045, drop.y + drop.length);
                rainCtx.stroke();
            }

            window.smartDisplayRainState = {
                ...(window.smartDisplayRainState || {}),
                running: true,
                lastFrame: Math.round(timestamp)
            };
            rainAnimationFrame = requestAnimationFrame(drawRain);
        }

        function updateRainAnimation(mood, maxRain12h) {
            if (!rainCanvas || !rainCtx) return;
            rainStrength = Math.min(1, Math.max(0.35, maxRain12h / 100));
            buildRainDrops();

            if (mood === 'rain' && !document.hidden) {
                if (!rainAnimationFrame) {
                    rainLastTime = performance.now();
                    rainAnimationFrame = requestAnimationFrame(drawRain);
                }
            } else if (rainAnimationFrame) {
                cancelAnimationFrame(rainAnimationFrame);
                rainAnimationFrame = null;
                rainCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                window.smartDisplayRainState = {
                    ...(window.smartDisplayRainState || {}),
                    running: false
                };
            }
        }

        function pauseRainAnimation() {
            if (!rainCanvas || !rainCtx) return;
            if (rainAnimationFrame) {
                cancelAnimationFrame(rainAnimationFrame);
                rainAnimationFrame = null;
            }
            rainCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            window.smartDisplayRainState = {
                ...(window.smartDisplayRainState || {}),
                running: false,
                paused: document.hidden
            };
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                document.body.classList.add('page-hidden');
                pauseRainAnimation();
                return;
            }
            document.body.classList.remove('page-hidden');
            if (document.body.classList.contains('weather-rain')) {
                updateRainAnimation('rain', Number(document.body.dataset.rain12h || 50));
            }
        });

        setTimeout(() => {
            window.location.reload();
        }, autoReloadMs);

        window.addEventListener('resize', resizeRainCanvas);
        resizeRainCanvas();

        function getNextHours(data, hours = 12) {
            const times = data.hourly?.time || [];
            const now = Date.now();
            let startIndex = times.findIndex(time => new Date(time).getTime() >= now - 30 * 60 * 1000);
            if (startIndex < 0) startIndex = 0;
            return Array.from({ length: hours }, (_, offset) => startIndex + offset).filter(index => index < times.length);
        }

        function valuesAtIndexes(values, indexes) {
            return indexes
                .map(index => Number(values?.[index]))
                .filter(value => Number.isFinite(value));
        }

        function average(values) {
            if (!values.length) return 0;
            return values.reduce((sum, value) => sum + value, 0) / values.length;
        }

        function updateWeatherMood(data) {
            const indexes = getNextHours(data, 12);
            const rainValues = valuesAtIndexes(data.hourly?.precipitation_probability, indexes);
            const cloudValues = valuesAtIndexes(data.hourly?.cloud_cover, indexes);
            const hourlyCodes = valuesAtIndexes(data.hourly?.weather_code, indexes);
            const maxRain12h = rainValues.length ? Math.max(...rainValues) : Number(data.daily?.precipitation_probability_max?.[0] || 0);
            const avgCloud12h = cloudValues.length ? average(cloudValues) : Number(data.current?.cloud_cover || 0);
            const currentCode = Number(data.current?.weather_code);
            const currentTemp = Number(data.current?.temperature_2m);
            const currentHumidity = Number(data.current?.relative_humidity_2m);
            const hasRainCode = hourlyCodes.some(code => code >= 51 && code <= 99);
            const hasCloudCode = hourlyCodes.some(code => code === 2 || code === 3 || (code >= 45 && code <= 48));
            const isComfortable = (
                !hasRainCode &&
                maxRain12h <= 30 &&
                avgCloud12h <= 60 &&
                currentCode <= 3 &&
                currentTemp >= 20 &&
                currentTemp <= 27 &&
                currentHumidity >= 45 &&
                currentHumidity <= 70
            );
            const isSunny = currentCode <= 1 && avgCloud12h < 45;
            const isCloudy = hasRainCode || hasCloudCode || avgCloud12h >= 58 || currentCode === 2 || currentCode === 3;
            let mood = 'comfort';

            if (maxRain12h > 50 || (!rainValues.length && hasRainCode)) mood = 'rain';
            else if (isComfortable) mood = 'comfort';
            else if (isSunny) mood = 'sunny';
            else if (isCloudy) mood = 'cloudy';

            document.body.classList.remove(...weatherMoodClasses);
            document.body.classList.add(`weather-${mood}`);
            document.body.dataset.weatherMood = mood;
            document.body.dataset.rain12h = String(Math.round(maxRain12h));
            document.documentElement.style.setProperty('--rain-strength', String(Math.min(1, Math.max(0.35, maxRain12h / 100))));
            updateRainAnimation(mood, maxRain12h);
            window.smartDisplayWeatherMood = { mood, maxRain12h, avgCloud12h, currentTemp, currentHumidity, currentCode };
            return window.smartDisplayWeatherMood;
        }

        function renderWeather(data, stale = false, updatedAt = Date.now()) {
            const mood = updateWeatherMood(data);
            document.getElementById('current-temp').textContent = Math.round(data.current.temperature_2m) + '°';
            document.getElementById('current-condition').innerHTML = getIconHtml(data.current.weather_code);
            document.getElementById('current-humidity').textContent = data.current.relative_humidity_2m;
            document.getElementById('current-rain').textContent = Math.round(mood.maxRain12h);
            const state = document.getElementById('weatherDataState');
            state.className = `data-state${stale ? ' warning' : ''}`;
            state.textContent = `${stale ? '離線備援資料・' : ''}${formatUpdatedAt(updatedAt)}`;
            const grid = document.getElementById('forecast-grid'); grid.innerHTML = '';
            const days = ['日', '一', '二', '三', '四', '五', '六'];
            for (let i = 1; i <= 5; i++) {
                const dateObj = new Date(data.daily.time[i]);
                const dailyHumidity = data.hourly.relative_humidity_2m[i * 24 + 12] || '--';
                const maxT = Math.round(data.daily.temperature_2m_max[i]);
                const minT = Math.round(data.daily.temperature_2m_min[i]);
                const rain = data.daily.precipitation_probability_max[i];
                grid.innerHTML += `
                    <div class="forecast-item">
                        <div class="day">${days[dateObj.getDay()]}</div>
                        <div class="icon">${getIconHtml(data.daily.weather_code[i])}</div>
                        <div class="temp">${minT}°-${maxT}°</div>
                        <div class="details"><span><i class="fa-solid fa-droplet"></i> ${dailyHumidity}%</span><span><i class="fa-solid fa-umbrella"></i> ${rain}%</span></div>
                    </div>`;
            }
        }

        async function fetchWeather(lat, lon) {
            const state = document.getElementById('weatherDataState');
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,cloud_cover&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&hourly=relative_humidity_2m,precipitation_probability,cloud_cover,weather_code,temperature_2m&forecast_days=7&timezone=auto`;
                const res = await fetch(url);
                if (!res.ok) throw new Error(`Weather request failed: ${res.status}`);
                const data = await res.json();
                if (!data.current || !data.daily || !data.hourly) throw new Error('Weather response incomplete');
                const cached = { data, updatedAt: Date.now() };
                try { localStorage.setItem('smartDisplay_weatherCache', JSON.stringify(cached)); } catch {}
                renderWeather(data, false, cached.updatedAt);
            } catch (err) {
                try {
                    const cached = JSON.parse(localStorage.getItem('smartDisplay_weatherCache') || 'null');
                    if (cached?.data && Date.now() - cached.updatedAt <= 24 * 60 * 60 * 1000) {
                        renderWeather(cached.data, true, cached.updatedAt);
                        return;
                    }
                } catch {}
                state.className = 'data-state error';
                state.textContent = '天氣服務暫時無法連線，請稍後再試';
            }
        }
        function initLocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        const lat = pos.coords.latitude, lon = pos.coords.longitude; fetchWeather(lat, lon);
                        try {
                            const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`);
                            const data = await res.json(); document.getElementById('location').innerHTML = `<i class="fa-solid fa-location-dot"></i> ${data.city || data.locality}`;
                        } catch {}
                    },
                    () => { document.getElementById('location').innerHTML = '<i class="fa-solid fa-location-dot"></i> 彰化市(預設)'; fetchWeather(24.08, 120.54); }
                );
            } else { fetchWeather(24.08, 120.54); }
        }
        initLocation(); setInterval(initLocation, lowPerformanceMode ? 60 * 60 * 1000 : 30 * 60 * 1000);

        document.getElementById('wakeBtn').addEventListener('click', async () => {
            try {
                await navigator.wakeLock.request('screen');
                document.getElementById('wakeStatus').innerHTML = '<span style="color:#fbc02d;"><i class="fa-solid fa-lightbulb"></i> 恆亮中</span>';
                document.getElementById('wakeBtn').style.display = 'none';
            } catch (err) {
                document.getElementById('wakeStatus').innerHTML = '<span style="color:#ff5d5d;"><i class="fa-solid fa-triangle-exclamation"></i> 此瀏覽器無法啟用螢幕恆亮</span>';
            }
        });
        function playTone(type, freq, dur) {
            if (!audioReady) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + dur);
        }

        let lastEqTime = null, eqBeepInterval;
        async function checkRealEarthquake() {
            try {
                const res = await fetch('/api/earthquake/latest');
                const data = await res.json();
                const status = document.getElementById('eqStatus');
                if (data.status === 'ok' && data.item) {
                    const latestEq = data.item;
                    const eqTime = latestEq.originTime;
                    status.innerHTML = data.stale
                        ? `<span style="color:#ff9f1c;"><i class="fa-solid fa-clock-rotate-left"></i> 地震報告離線備援・${formatUpdatedAt(data.updatedAt)}</span>`
                        : `<span style="color:#2e7d32;"><i class="fa-solid fa-file-waveform"></i> 最新地震報告監控・${formatUpdatedAt(data.updatedAt)}</span>`;
                    if (!lastEqTime) { lastEqTime = eqTime; return; }
                    if (!data.stale && eqTime !== lastEqTime) {
                        lastEqTime = eqTime;
                        const reportContent = latestEq.reportContent;
                        const magnitude = latestEq.magnitude;
                        const depth = latestEq.depth;
                        triggerEqAlarm(`芮氏規模：<span style="color:#e74c3c; font-weight:bold;">${magnitude}</span><br>深度：${depth} 公里<br><br><span style="font-size: 2.2vw;">${reportContent}</span>`);
                    }
                    return;
                }
                status.innerHTML = `<span style="color:#ff5d5d;"><i class="fa-solid fa-triangle-exclamation"></i> ${data.message || '地震報告暫時無法取得'}</span>`;
            } catch (err) {
                document.getElementById('eqStatus').innerHTML = '<span style="color:#ff5d5d;"><i class="fa-solid fa-triangle-exclamation"></i> 地震報告連線失敗</span>';
            }
        }
        function triggerEqAlarm(infoHtml) {
            document.body.classList.add('eq-active'); document.getElementById('eq-overlay').style.display = 'flex'; document.getElementById('eq-info-text').innerHTML = infoHtml;
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            playTone('square', 800, 0.3); eqBeepInterval = setInterval(() => playTone('square', 800, 0.3), 800);
        }
        setInterval(checkRealEarthquake, lowPerformanceMode ? 5 * 60 * 1000 : 60 * 1000); setTimeout(checkRealEarthquake, 2000);
        document.getElementById('dismissEqBtn').addEventListener('click', () => { document.body.classList.remove('eq-active'); document.getElementById('eq-overlay').style.display = 'none'; clearInterval(eqBeepInterval); });
        
        function triggerAlarm() {
            isAlarmRinging = true; document.body.classList.add('alarm-active'); document.getElementById('alarm-overlay').style.display = 'flex';
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            playTone('triangle', 600, 0.4); alarmSoundInterval = setInterval(() => playTone('triangle', 600, 0.4), 1000);
        }
        document.getElementById('dismissAlarmBtn').addEventListener('click', () => {
            isAlarmRinging = false; document.body.classList.remove('alarm-active'); document.getElementById('alarm-overlay').style.display = 'none'; clearInterval(alarmSoundInterval); cancelAlarmBtn.click();
        });

        // 常駐顯示器的定期清理：只釋放可重建的暫存資料，不刪除使用者設定。
        function cleanupRuntimeMemory() {
            newsList = newsList.slice(0, 20);
            document.querySelectorAll('#news-container-wrapper .news-grid-page').forEach((node, index, nodes) => {
                if (index < nodes.length - 1) node.remove();
            });
            if (lowPerformanceMode && !document.body.classList.contains('weather-rain')) {
                rainDrops = [];
            }
            try {
                const cached = JSON.parse(localStorage.getItem('smartDisplay_weatherCache') || 'null');
                if (cached?.updatedAt && Date.now() - cached.updatedAt > 24 * 60 * 60 * 1000) {
                    localStorage.removeItem('smartDisplay_weatherCache');
                }
            } catch {
                localStorage.removeItem('smartDisplay_weatherCache');
            }
        }
        setInterval(cleanupRuntimeMemory, 10 * 60 * 1000);
    </script>
